<text x="25" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="#e6edf3">Source-code evidence: three distinct strategies</text>
<text x="30" y="65" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">def linear_search(records, target):  # iterative sequential scan</text>
<text x="30" y="88" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">    for comparisons, student in enumerate(records, start=1): ...</text>
<text x="30" y="111" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">def recursive_binary_search(index, target):  # recursive halving</text>
<text x="30" y="134" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">    return visit(0, len(index) - 1, 0)</text>
<text x="30" y="157" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">def hash_search(index, target):  # expected O(1) direct lookup</text>
<text x="30" y="180" font-family="Menlo,monospace" font-size="15" fill="#c9d1d9">    return SearchResult(index.get(target), 1)</text>
